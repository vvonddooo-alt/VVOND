<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WOND Admin</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #app { background: var(--bg); padding: 2rem; }
    .admin-section { margin: 2rem 0; padding: 1.5rem; background: var(--card); border-radius: 0.5rem; border: 1px solid var(--line); }
    .admin-section h3 { margin-top: 0; color: var(--ink); }
    input, select, textarea { display: block; width: 100%; margin: 0.5rem 0; padding: 0.5rem; border: 1px solid var(--line); border-radius: 0.25rem; font-family: inherit; font-size: 1rem; }
    input[type="file"] { padding: 0.25rem; }
    button { background: var(--accent); color: var(--dark); border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; }
    button:hover { opacity: 0.9; }
    .status { min-height: 1.5rem; font-size: 0.9rem; margin-top: 0.5rem; }
    .status.error { color: #d32f2f; }
    .status.success { color: #2e7d32; }
    #login { max-width: 400px; margin: 4rem auto; padding: 2rem; background: var(--card); border: 1px solid var(--line); border-radius: 0.5rem; }
    #login h2 { margin-top: 0; }
    .user-info { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--bg); border-radius: 0.5rem; margin-bottom: 2rem; }
    .user-info button { margin: 0; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <main>
    <section id="login" hidden>
      <h2>WOND Admin</h2>
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="admin@example.com">
      <label for="password">Heslo:</label>
      <input type="password" id="password" placeholder="••••••••">
      <button id="loginBtn">Přihlásit se</button>
      <div id="loginStatus" class="status"></div>
    </section>

    <section id="app" hidden>
      <div class="user-info">
        <span>Přihlášen jako: <strong id="userEmail"></strong></span>
        <button id="logoutBtn">Odhlásit se</button>
      </div>
      <div id="logoutStatus" class="status"></div>

      <div class="admin-section">
        <h3>📸 Hlavní fotografie</h3>
        <input type="file" id="photo" accept="image/*">
        <button id="uploadPhoto">Nahrát fotografii</button>
        <div id="photoStatus" class="status"></div>
      </div>

      <div class="admin-section">
        <h3>📄 Ceníky (PDF)</h3>
        <label for="docCountry">Země:</label>
        <select id="docCountry">
          <option value="">-- Vyber zemi --</option>
          <option value="CZ">Česko</option>
          <option value="SK">Slovensko</option>
          <option value="SI">Slovenija</option>
          <option value="DE">Deutschland</option>
          <option value="PL">Polska</option>
          <option value="HU">Magyarország</option>
          <option value="HR">Hrvatska</option>
          <option value="RO">România</option>
          <option value="UA">Україна</option>
          <option value="GB">United Kingdom</option>
        </select>
        <label for="docTitle">Název (volitelný):</label>
        <input type="text" id="docTitle" placeholder="Ceník služeb">
        <input type="file" id="docFile" accept="application/pdf">
        <button id="uploadDoc">Nahrát PDF ceník</button>
        <div id="docStatus" class="status"></div>
        <div id="docList" style="margin-top: 1rem; font-size: 0.9rem;"></div>
      </div>

      <div class="admin-section">
        <h3>🏢 Firemní údaje (IČO, DIČ, ...)</h3>
        <label for="idCountry">Země:</label>
        <select id="idCountry">
          <option value="">-- Vyber zemi --</option>
          <option value="CZ">Česko</option>
          <option value="SK">Slovensko</option>
          <option value="SI">Slovenija</option>
          <option value="DE">Deutschland</option>
          <option value="PL">Polska</option>
          <option value="HU">Magyarország</option>
          <option value="HR">Hrvatska</option>
          <option value="RO">România</option>
          <option value="UA">Україна</option>
          <option value="GB">United Kingdom</option>
        </select>
        <label for="idLabel">Název (IČO, DIČ, DPH, ...):</label>
        <input type="text" id="idLabel" placeholder="IČO">
        <label for="idValue">Hodnota:</label>
        <input type="text" id="idValue" placeholder="12345678">
        <button id="saveId">Uložit údaj</button>
        <div id="idStatus" class="status"></div>
        <div id="idList" style="margin-top: 1rem; font-size: 0.9rem;"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
