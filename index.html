<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOND | Elektro & Voda</title>
    <meta name="description" content="Profesionální elektroinstalační, instalatérské a montážní práce pro domácnosti i firmy.">
    <link rel="alternate" hreflang="en" href="http://vvond.eu/" />
    <link rel="alternate" hreflang="cs" href="http://vvond.eu" />
    <link rel="alternate" hreflang="uk" href="http://vvond.eu" />
    <link rel="alternate" hreflang="x-default" href="http://vvond.eu/" />
    <script>
        // Автоматичне визначення мови браузера користувача
        (function() {
            if (!localStorage.getItem('language_redirected')) {
                const userLang = navigator.language || navigator.userLanguage;
                localStorage.setItem('language_redirected', 'true');
                if (userLang.startsWith('cs') || userLang.startsWith('sk')) {
                    window.location.replace('index_cz.html');
                } else if (userLang.startsWith('uk') || userLang.startsWith('ru')) {
                    window.location.replace('index_ua.html');
                } else {
                    window.location.replace('index_cz.html'); // Якщо мова інша, відкриваємо чеську як основну для бізнесу в Брно
                }
            } else {
                window.location.replace('index_cz.html');
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to WOND...</p>
</body>
</html>
